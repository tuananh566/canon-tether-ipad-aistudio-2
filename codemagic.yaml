workflows:
  ios-ipad-workflow:
    name: Canon Tether Studio (iPadOS IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.canontether.studio"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies and build web bundle
        script: |
          set -e
          rm -f package-lock.json
          npm install --include=optional --legacy-peer-deps
          npm run build
      - name: Generate and sync Capacitor iOS project
        script: |
          set -e
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Install CocoaPods dependencies if Podfile exists
        script: |
          set -e
          if [ -f "ios/App/Podfile" ]; then
            find ios -name "Podfile" -execdir pod install \;
          fi
      - name: Configure iPadOS support, AppIcon & Canon CCAPI permissions
        script: |
          set -e
          python3 scripts/configure-ios.py
      - name: Build unsigned iPadOS IPA
        script: |
          set -e
          BUILD_DIR="$CM_BUILD_DIR/xcode_build"
          if [ -d "$XCODE_WORKSPACE" ]; then
            xcodebuild \
              -workspace "$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              TARGETED_DEVICE_FAMILY="2" \
              INFOPLIST_KEY_CFBundleDisplayName="Canon Tether Studio" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              SYMROOT="$BUILD_DIR" \
              build
          else
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              TARGETED_DEVICE_FAMILY="2" \
              INFOPLIST_KEY_CFBundleDisplayName="Canon Tether Studio" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              SYMROOT="$BUILD_DIR" \
              build
          fi

          APP_PATH=$(find "$BUILD_DIR/Release-iphoneos" -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built .app bundle"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/ipa_stage/Payload"
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa_stage/Payload/"
          cd "$CM_BUILD_DIR/ipa_stage"
          zip -qry "$CM_BUILD_DIR/build/ios/ipa/CanonTetherStudio.ipa" Payload
          ls -lh "$CM_BUILD_DIR/build/ios/ipa/CanonTetherStudio.ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
