name: Build iPad IPA (Canon Tether Studio)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub macOS Runner'
        required: false
        default: 'macos-26'
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-latest
          - macos-15-intel
          - macos-26-intel
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    name: Build Unsigned iPadOS / iOS IPA
    runs-on: ${{ inputs.runner || 'macos-26' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Generate and sync Capacitor iOS project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Configure iPadOS support & Canon CCAPI network permissions in Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          python3 - <<'PY'
          import plistlib

          plist_path = "ios/App/App/Info.plist"
          with open(plist_path, "rb") as f:
              data = plistlib.load(f)

          # Configure strictly for iPadOS (UIDeviceFamily = 2) with 4-way orientation & multitasking
          data["CFBundleDisplayName"] = "Canon Tether Studio"
          data["UIDeviceFamily"] = [2]
          data["UIRequiresFullScreen"] = False
          data["UISupportedInterfaceOrientations~ipad"] = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationPortraitUpsideDown",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]

          # Allow HTTP local Wi-Fi connections to Canon CCAPI (e.g. http://192.168.1.2:8080)
          data["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": True,
              "NSAllowsLocalNetworking": True,
          }

          # Required iPadOS / iOS permission prompts
          data["NSLocalNetworkUsageDescription"] = (
              "Canon Tether Studio cần quyền truy cập mạng Wi-Fi cục bộ để kết nối và điều khiển máy ảnh Canon qua CCAPI."
          )
          data["NSPhotoLibraryAddUsageDescription"] = (
              "Canon Tether Studio cần quyền lưu ảnh chụp từ máy ảnh Canon vào thư viện Ảnh trên iPad."
          )
          data["NSPhotoLibraryUsageDescription"] = (
              "Canon Tether Studio cần quyền chọn ảnh tham chiếu từ thư viện Ảnh trên iPad."
          )

          with open(plist_path, "wb") as f:
              plistlib.dump(data, f)
          print("Updated Info.plist successfully")
          PY

      - name: Build iPadOS App archive (Release, arm64)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              TARGETED_DEVICE_FAMILY="2" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              SYMROOT="$(pwd)/build" \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              TARGETED_DEVICE_FAMILY="2" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              SYMROOT="$(pwd)/build" \
              build
          fi

      - name: Package CanonTetherStudio.ipa
        run: |
          mkdir -p ipa_out/Payload
          APP_PATH=$(find "$(pwd)/build/Release-iphoneos" -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built .app bundle"
            exit 1
          fi
          cp -R "$APP_PATH" ipa_out/Payload/
          cd ipa_out
          zip -qry ../CanonTetherStudio.ipa Payload
          cd ..
          ls -lh CanonTetherStudio.ipa

      - name: Upload CanonTetherStudio.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanonTetherStudio-iPad-IPA
          path: CanonTetherStudio.ipa
          retention-days: 30
